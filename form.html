        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        body {
            display: flex;
            justify-content: center;
            height: 100vh;
            align-items: center;
            margin: 0;
            font-family: 'Courier New', Courier, monospace;
        }
        .password-container{
            background-color: pink;
            width: 500px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4pv 8px rgba(0, 0, 0, 3);
            margin: 10px;

        }

        .input-container{
            border: solid 2px black;
            padding: 10px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .input{
            border: none;
            background-color: transparent;
            font-size: 24px;
            letter-spacing: 4px;
        }

        .input::placeholder{
            letter-spacing: 0px;

        }
        .fa-copy{
            cursor: pointer;
            opacity: 0.3;
            
        }
        .btn{
            background-color: black;
            color: white;
            border-radius: none;
            padding: 10px 20px;
            border-radius: 5px;
            margin: 10px 0px;
            font-size: 20px;
            cursor: pointer;

        }
        .btn:hover{
            background-color: darkgreen;

        }
        .btn:active{
            transform: scale(0.93);
    
            
        }

        .alert-container{
            position: fixed;
            width: 300px;
            height: 50px;
            background-color: darkgreen;
            right: 20px;
            bottom: 20px;
            border-radius: 10px;
            box-shadow: 0,4px,8px rgba(0, 0, 0, 3);
    
        }
        .alert-container{
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
        }
        
       
    </style>
    
    </head>
