<!DOCTYPE html>
<html>
    <head>
        <title>Registration Form</title>
    </head>

    <body>
        <h1>Fill the form below to register.</h1>
        <label>First Name:</label>
        <input type="text" placeholder="enter first name" required>
        <br> <br>
        <label>Last Name:</label>
        <input type="text" placeholder="enter last name" required>
        <br><br>
        <label>Date of Birth:</label>
        <input type="date" required>
        <br><br>

        <label>Select Your Gender.</label><br>
        <label>Male:</label>
        <input type="radio">
        <label>Femal:</label>
        <input type="radio">
        <label>Others:</label>
        <input type="radio">
        <br><br>

        <label>Email:</label>
        <input type="email" placeholder="enter email" required>
        <br><br>

        <label>Enter Password:</label>
        <input type="password" placeholder="enter password" minlength="5" maxlength="10" required>
         <br><br>
        <label>Confirm Password:</label>
        <input type="password" placeholder=" repeat password" minlength="5" maxlength="10" required>
         <br><br>
         
         <label>Choose Your State:</label>

         <select>
            <option>select your state</option>
            <option>Taraba State</option>
            <option>Adamawa State</option>
            <option>Kano State</option>
            <option>Gombe State</option>
            <option>Yobe State</option>
            <option>Kaduna State</option>
            <option>Jagawa State</option>

        </select>
        <br>

         <h4>Select Your Courses.</h4>
        
         <label>Python:</label>
         <input type="checkbox">

        <label>HTML:</label>
        <input type="checkbox">

        <label>C++:</label>
        <input type="checkbox">

        <label>PHP:</label>
        <input type="checkbox">


        <label>C:</label>
        <input type="checkbox">


        <label>React</label>
        <input type="checkbox">

        <button>Submit Form</button>
        
        <br><br><br><br>

        







    </body>
</html>
